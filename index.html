<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBS컴퓨터아트학원 안산점 — 개강안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f8faff;
  --surface:#ffffff;
  --surface2:#f0f4fc;
  --border:#dce4f0;
  --border2:#2355c8;
  --text:#101c3a;
  --text2:#2c4a8a;
  --text3:#7a96cc;
  --blue:#2355c8;
  --blue-dim:#1a42a8;
  --yl:#f5c400;
  --yl-dim:#d9a800;
  --yl-pale:#fffbe0;
  --radius:10px;
  --radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}

/* HEADER */
.header{
  background:#fff;
  border-bottom:3px solid #1a42a8;
  padding:0 32px;
}
.header-top{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;}
.logo-title{font-size:19px;font-weight:900;color:var(--text);letter-spacing:-0.5px;}
.logo-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;width:200px;}
.search-box input{border:none;outline:none;font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--text);width:100%;background:transparent;}
.search-box input::placeholder{color:var(--text3);}
.settings-btn{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--text2);cursor:pointer;font-weight:600;white-space:nowrap;}
.settings-btn:hover{border-color:var(--blue);color:var(--blue);}

/* ROOM FILTER */
.room-bar-inner{max-width:1200px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:10px 0;}
.room-bar-wrap{background:#fff;border-bottom:1px solid var(--border);padding:0 32px;}
.room-btn{height:30px;padding:0 14px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text2);font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.room-btn:hover{border-color:var(--blue);color:var(--blue);}
.room-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* UPLOAD */
.upload-bar{background:var(--surface2);border-bottom:1px solid var(--border);padding:8px 32px;}
.upload-bar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.upload-label{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--border);border-radius:8px;padding:6px 14px;font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s;}
.upload-label:hover{border-color:var(--blue);color:var(--blue);}
.upload-label input{display:none;}
.upload-status{font-size:12px;color:var(--text3);}
.upload-status.ok{color:#16a34a;}.upload-status.err{color:#dc2626;}

/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:24px 32px 60px;}

/* TABS + TOOLBAR */
.tab-toolbar{display:flex;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.tabs{display:flex;gap:6px;}
.tab-btn{display:flex;align-items:center;gap:7px;padding:9px 20px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text2);font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{border-color:var(--blue);color:var(--blue);}
.tab-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}

/* 다중선택, 선택복사 — 노란색 */
.multi-btn{display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;border:1.5px solid var(--yl);background:#fff;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;}
.multi-btn:hover{background:var(--yl-pale);}
.multi-btn.on{background:var(--yl);color:#101c3a;border-color:var(--yl);}
.copy-all-btn{display:flex;align-items:center;gap:6px;padding:9px 20px;border-radius:8px;border:none;background:var(--yl);color:#101c3a;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;}
.copy-all-btn:hover{background:var(--yl-dim);color:#fff;}
.copy-all-btn:active{transform:scale(0.97);}

/* STATS */
.stats-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.stats-text{font-size:13px;color:var(--text2);}
.stats-text b{color:var(--text);font-weight:700;}
.sel-count{font-size:13px;color:var(--text3);}
.sel-count.active{color:var(--blue);font-weight:600;}
.clear-btn{background:none;border:none;font-size:12px;color:var(--text3);cursor:pointer;padding:4px 8px;}
.clear-btn:hover{color:var(--text2);}

/* LIST */
.list{display:flex;flex-direction:column;gap:8px;}
.list-item{background:#fff;border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:var(--radius);display:flex;align-items:center;gap:14px;padding:13px 16px;transition:all .15s;cursor:pointer;}
.list-item:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(35,85,200,0.08);}
.list-item.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(35,85,200,0.15);background:#f5f8ff;}
.list-chk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border);background:#fff;cursor:pointer;flex-shrink:0;accent-color:var(--blue);display:none;}
.list-chk.show{display:block;}
.room-badge{flex-shrink:0;background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:4px 11px;border-radius:6px;white-space:nowrap;}
.item-info{flex:1;min-width:0;}
.item-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;letter-spacing:-0.2px;}
.item-meta{font-size:12px;color:var(--text3);}
.item-meta span+span::before{content:'|';margin:0 5px;color:var(--border);}

/* 복사 버튼 — 노란색 */
.copy-btn{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:7px 16px;border-radius:8px;border:1.5px solid var(--yl);background:var(--yl-pale);color:#7a6200;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;}
.copy-btn:hover{background:var(--yl);color:#101c3a;border-color:var(--yl);}
.copy-btn.copied{background:var(--yl);color:#101c3a;}

.empty{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-icon{font-size:36px;margin-bottom:12px;display:block;opacity:.5;}
.empty-title{font-size:15px;color:var(--text2);font-weight:500;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--yl);color:#101c3a;padding:11px 24px;border-radius:8px;font-size:14px;font-weight:700;opacity:0;transition:all .25s;z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,18,50,.45);z-index:500;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border:1px solid var(--border);border-top:3px solid var(--blue);border-radius:var(--radius);width:540px;max-width:95vw;max-height:85vh;overflow-y:auto;}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:15px;font-weight:700;}
.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:2px 8px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:20px;}
.modal-sec{margin-bottom:22px;}
.modal-sec:last-child{margin-bottom:0;}
.modal-sec-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.dc-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.dc-row label{font-size:13px;font-weight:600;min-width:72px;color:var(--text);}
.dc-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;height:30px;padding:0 9px;}
.dc-row input:focus{outline:none;border-color:var(--blue);}
.modal-iw{margin-bottom:10px;}
.modal-iw label{font-size:13px;font-weight:500;display:block;margin-bottom:4px;color:var(--text);}
.modal-iw input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;height:34px;padding:0 10px;}
.modal-iw input:focus{outline:none;border-color:var(--blue);}

@media(max-width:680px){
  .header{padding:0 16px;}
  .room-bar-wrap{padding:0 16px;}
  .main{padding:16px 16px 40px;}
  .upload-bar{padding:8px 16px;}
  .logo-title{font-size:16px;}
  .tab-toolbar{flex-wrap:wrap;}
  .toolbar-right{margin-left:0;}
  .search-box{width:140px;}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="logo-title">SBS컴퓨터아트학원 안산점 — 개강안내</div>
      <div class="logo-sub">과목을 선택해 메시지를 복사하세요</div>
    </div>
    <div class="header-right">
      <div class="search-box">
        <span style="color:var(--text3);font-size:14px;">🔍</span>
        <input type="text" id="search" placeholder="과목명 검색" oninput="applyFilters()">
      </div>
      <button class="settings-btn" onclick="openModal()">⚙️ 설정</button>
    </div>
  </div>
</div>
<div class="room-bar-wrap">
  <div class="room-bar-inner">
    <button class="room-btn active" onclick="setRoom('')">전체</button>
    <button class="room-btn" onclick="setRoom('A강의장')">A강의장</button>
    <button class="room-btn" onclick="setRoom('B강의장')">B강의장</button>
    <button class="room-btn" onclick="setRoom('C강의장')">C강의장</button>
    <button class="room-btn" onclick="setRoom('D강의장')">D강의장</button>
    <button class="room-btn" onclick="setRoom('E강의장')">E강의장</button>
    <button class="room-btn" onclick="setRoom('F강의장')">F강의장</button>
    <button class="room-btn" onclick="setRoom('G강의장')">G강의장</button>
    <button class="room-btn" onclick="setRoom('H강의장')">H강의장</button>
  </div>
</div>

<div class="upload-bar">
  <div class="upload-bar-inner">
    <label class="upload-label">
      📊 시간표 엑셀 업로드
      <input type="file" accept=".xls,.xlsx" onchange="handleFile(this.files[0])">
    </label>
    <span class="upload-status" id="upload-status">시간표 .xls 파일을 올리면 자동으로 강좌를 불러옵니다</span>
  </div>
</div>

<div class="main">
  <div class="tab-toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="toolbar-right">
      <button class="multi-btn" id="multi-btn" onclick="toggleMulti()">☑️ 다중선택</button>
      <button class="copy-all-btn" id="sel-copy-btn" onclick="copySelected()" style="display:none">📋 선택 복사</button>
    </div>
  </div>
  <div class="stats-row">
    <span class="stats-text" id="stats-text">총 <b>0</b>개 과목</span>
    <span class="sel-count" id="sel-count">0개 선택됨</span>
    <button class="clear-btn" id="clear-btn" onclick="clearSel()" style="display:none">✕ 선택 해제</button>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">⚙️ 공통 설정</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-sec">
        <div class="modal-sec-title">강의장별 디스코드 링크</div>
        <div id="dc-list"></div>
      </div>
      <div class="modal-sec">
        <div class="modal-sec-title">고정 문구</div>
        <div class="modal-iw">
          <label>필독 안내 구글 시트 URL</label>
          <input type="text" id="gs-url" value="https://minsung617-prog.github.io/sbs-class/">
        </div>
        <div class="modal-iw">
          <label>필독 설명 문구</label>
          <input type="text" id="notice-text" value="[강의장 비대면 링크, 자습가능 강의장, 격일시간표안내, 세미나안내, 자격증 신청방법 등등]">
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DISCORD={
  'A강의장':'https://discord.gg/UbPVxWgcct',
  'B강의장':'https://discord.gg/VBaPncjxXe',
  'C강의장':'https://discord.gg/2WcQwuzvxy',
  'D강의장':'https://discord.gg/bHxVuv3AxS',
  'E강의장':'https://discord.gg/Th6NfQvSHF',
  'F강의장':'https://discord.gg/cEDxpq6aVS',
  'G강의장':'https://discord.gg/KrHJzzErWt',
  'H강의장':'https://discord.gg/7x4cFMtgcn'
};
const ROOMS=Object.keys(DISCORD);

// 강좌 데이터: sbs-class 저장소의 courses.json (KEG 인트라넷 시간표에서 자동 생성 · sbs-class/tools/courses-build.js). 실패 시 이 저장소의 courses.json 사용
let tabs=[];
let activeTab='',activeRoom='',multiMode=false,selected=new Set(),nextId=1;

function buildTabsFromJson(data){
  const idx=Object.fromEntries(data.cols.map((c,i)=>[c,i]));
  const md=s=>s.slice(5).replace('-','.');
  const nowKst=new Date(Date.now()+9*3600e3);
  const today=nowKst.toISOString().slice(0,10), curYm=today.slice(0,7);
  const endYm=(data.range&&data.range[1]?data.range[1]:today).slice(0,7);
  const courses=data.rows.map(r=>({
    id:nextId++,subject:r[idx.subject],teacher:'',days:r[idx.days],
    isWeekend:!!r[idx.weekend],start:r[idx.start],end:r[idx.end],
    startDate:md(r[idx.start]),endDate:md(r[idx.end]),
    timeStart:r[idx.timeStart],timeEnd:r[idx.timeEnd],room:r[idx.room],
    supplies:'X',isOnline:r[idx.online]?'비대면':'대면'}));
  const months=[];
  for(let d=new Date(curYm+'-01T00:00:00Z');d.toISOString().slice(0,7)<=endYm;d.setUTCMonth(d.getUTCMonth()+1))months.push(d.toISOString().slice(0,7));
  const out=[];
  months.forEach(ym=>{
    const m=+ym.slice(5)+'월';
    // 이번 달 탭: 이번 달 개강 + 현재 진행 중인 반 / 이후 달 탭: 그 달 개강 반
    const inMonth=c=>ym===curYm?(c.start.slice(0,7)===ym||(c.start<ym&&c.end>=today)):c.start.slice(0,7)===ym;
    const wd=courses.filter(c=>!c.isWeekend&&inMonth(c)),we=courses.filter(c=>c.isWeekend&&inMonth(c));
    if(wd.length)out.push({id:'wd_'+ym,label:m+' 평일반',icon:'📅',courses:wd});
    if(we.length)out.push({id:'we_'+ym,label:m+' 주말반',icon:'🗓️',courses:we});
  });
  return out;
}

function init(){
  initDc();renderTabs();
  document.getElementById('list').innerHTML='<div class="empty"><span class="empty-icon">⏳</span><div class="empty-title">강좌를 불러오는 중…</div></div>';
  const COURSES_URL='https://minsung617-prog.github.io/sbs-class/courses.json';
  fetch(COURSES_URL+'?v='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json();})
    .catch(()=>fetch('courses.json?v='+Date.now()).then(r=>r.json()))
    .then(data=>{
    tabs=buildTabsFromJson(data);activeTab=tabs[0]?tabs[0].id:'';
    setStatus('🔄 인트라넷 시간표 기준 · '+data.updated+' 자동 갱신 (엑셀을 올리면 그 내용으로 탭이 추가됩니다)','ok');
    renderTabs();applyFilters();
  }).catch(()=>{setStatus('❌ 강좌 데이터를 불러오지 못했습니다. 시간표 엑셀을 올려 주세요.','err');renderTabs();applyFilters();});
}

function renderTabs(){
  document.getElementById('tabs').innerHTML=tabs.map(t=>`
    <button class="tab-btn ${t.id===activeTab?'active':''}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}</button>`).join('');
}
function switchTab(id){activeTab=id;selected.clear();renderTabs();applyFilters();}
function setRoom(r){
  activeRoom=r;
  document.querySelectorAll('.room-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim()===(r||'전체')));
  applyFilters();
}
function getFiltered(){
  const tab=tabs.find(t=>t.id===activeTab);if(!tab)return[];
  const s=document.getElementById('search').value.toLowerCase();
  return tab.courses.filter(c=>{
    if(activeRoom&&c.room!==activeRoom)return false;
    if(s&&!c.subject.toLowerCase().includes(s))return false;
    return true;
  });
}
function applyFilters(){
  const f=getFiltered();
  document.getElementById('stats-text').innerHTML=`총 <b>${f.length}</b>개 과목`;
  renderList(f);updateSelInfo();
}
function renderList(courses){
  const el=document.getElementById('list');
  if(!courses.length){el.innerHTML=`<div class="empty"><span class="empty-icon">📭</span><div class="empty-title">강좌가 없습니다</div></div>`;return;}
  el.innerHTML=courses.map(c=>`
    <div class="list-item ${selected.has(c.id)?'selected':''}" id="item-${c.id}" onclick="onItemClick(${c.id})">
      <input type="checkbox" class="list-chk ${multiMode?'show':''}" id="chk-${c.id}" ${selected.has(c.id)?'checked':''} onclick="event.stopPropagation()" onchange="toggleSel(${c.id},this.checked)">
      <span class="room-badge">${c.room}</span>
      <div class="item-info">
        <div class="item-name">${c.subject}</div>
        <div class="item-meta">
          <span>${c.days}</span>
          <span>${c.timeStart}~${c.timeEnd}</span>
          <span>${c.startDate}~${c.endDate}</span>
          ${c.teacher?`<span>${c.teacher}</span>`:''}
        </div>
      </div>
      <button class="copy-btn" id="cb-${c.id}" onclick="copyItem(${c.id},event)">📋 복사</button>
    </div>`).join('');
}
function onItemClick(id){
  if(!multiMode)return;
  const chk=document.getElementById('chk-'+id);
  if(chk){chk.checked=!chk.checked;toggleSel(id,chk.checked);}
}
function toggleSel(id,checked){
  if(checked)selected.add(id);else selected.delete(id);
  const item=document.getElementById('item-'+id);
  if(item)item.classList.toggle('selected',selected.has(id));
  updateSelInfo();
}
function updateSelInfo(){
  const el=document.getElementById('sel-count');
  el.textContent=selected.size+'개 선택됨';
  el.classList.toggle('active',selected.size>0);
  const show=multiMode&&selected.size>0;
  document.getElementById('sel-copy-btn').style.display=show?'':'none';
  document.getElementById('clear-btn').style.display=multiMode?'':'none';
}
function toggleMulti(){
  multiMode=!multiMode;
  document.getElementById('multi-btn').classList.toggle('on',multiMode);
  if(!multiMode)selected.clear();
  applyFilters();updateSelInfo();
}
function clearSel(){selected.clear();applyFilters();updateSelInfo();}
function getDc(room){const el=document.getElementById('dc-'+room);return el?el.value:(DISCORD[room]||'');}
function genMsg(courses){
  const gsUrl=document.getElementById('gs-url').value;
  const notice=document.getElementById('notice-text').value;
  const header='🖥️ SBS 아카데미개강안내';
  const footer=`⭐️ 수강생 필독 ⭐️\n${gsUrl}\n${notice}\n\n⭐️ 개강안내 확인 후 답변 부탁 드립니다!`;
  if(courses.length===1){
    const c=courses[0];const dc=getDc(c.room);
    return `⭐️ 수강생 필독 ⭐️\n${gsUrl}\n${notice}\n\n${header}\n\n* 과목명: ${c.subject} \n* 수업: ${c.days}\n* 개강일: ${c.startDate} \n* 종강일: ${c.endDate} \n* 수업시간: ${c.timeStart}~${c.timeEnd} \n* 강의장 : ${c.room} \n* 준비물 : ${c.supplies} \n* 비대면유/무 : ${c.isOnline} \n* 비대면링크 :  ${dc}\n\n⭐️ 개강안내 확인 후 답변 부탁 드립니다!`;
  }
  const blocks=courses.map(c=>{const dc=getDc(c.room);return `* 과목명: ${c.subject} \n* 수업: ${c.days}\n* 개강일: ${c.startDate} \n* 종강일: ${c.endDate} \n* 수업시간: ${c.timeStart}~${c.timeEnd} \n* 강의장 : ${c.room} \n* 준비물 : ${c.supplies} \n* 비대면유/무 : ${c.isOnline} \n* 비대면링크 :  ${dc}`;}).join('\n\n');
  return `⭐️ 수강생 필독 ⭐️\n${gsUrl}\n${notice}\n\n${header}\n\n${blocks}\n\n⭐️ 개강안내 확인 후 답변 부탁 드립니다!`;
}
function copyItem(id,e){
  e.stopPropagation();
  const tab=tabs.find(t=>t.id===activeTab);const c=tab&&tab.courses.find(c=>c.id===id);if(!c)return;
  navigator.clipboard.writeText(genMsg([c])).then(()=>{
    const btn=document.getElementById('cb-'+id);
    if(btn){btn.classList.add('copied');btn.textContent='✓ 복사됨';setTimeout(()=>{btn.classList.remove('copied');btn.textContent='📋 복사';},1800);}
    toast('✅ 복사되었습니다!');
  });
}
function copyAll(){
  const f=getFiltered();if(!f.length){toast('강좌가 없습니다.');return;}
  navigator.clipboard.writeText(genMsg(f)).then(()=>toast(`✅ 전체 ${f.length}개 복사 완료!`));
}
function copySelected(){
  const tab=tabs.find(t=>t.id===activeTab);if(!tab)return;
  const toGen=tab.courses.filter(c=>selected.has(c.id));if(!toGen.length){toast('선택된 강좌가 없습니다.');return;}
  navigator.clipboard.writeText(genMsg(toGen)).then(()=>{
    toast(`✅ ${toGen.length}개 선택 복사 완료!`);
    // 복사 후 다중선택 초기화
    multiMode=false;
    selected.clear();
    document.getElementById('multi-btn').classList.remove('on');
    applyFilters();updateSelInfo();
  });
}
function handleFile(file){
  if(!file)return;setStatus('⏳ 읽는 중...','');
  const r=new FileReader();
  r.onload=e=>{
    try{
      const bytes=new Uint8Array(e.target.result);
      const isZip=bytes[0]===0x50&&bytes[1]===0x4B; // 'PK' — real .xlsx(zip) 파일
      if(isZip){parseXLSXFile(e.target.result,file.name);return;}
      const text=new TextDecoder('utf-8').decode(bytes);
      if(text.includes('전체출석율'))parseSBS(text,file.name);
      else setStatus('❌ 지원하지 않는 형식입니다.','err');
    }catch(err){setStatus('❌ 오류: '+err.message,'err');}
  };r.readAsArrayBuffer(file);
}
function parseXLSXFile(buf,filename){
  if(typeof XLSX==='undefined'){setStatus('❌ 엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.','err');return;}
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  if(!ws||!ws['!ref']){setStatus('❌ 지원하지 않는 형식입니다.','err');return;}
  const ref=XLSX.utils.decode_range(ws['!ref']);
  const merges=ws['!merges']||[];
  const cellVal=(r,c)=>{const cell=ws[XLSX.utils.encode_cell({r,c})];return cell&&cell.v!=null?String(cell.v).trim():'';};
  const headerRow=ref.s.r;

  // 헤더행(강의장 라벨, 병합셀=colspan)으로 컬럼→강의장 매핑 구성
  const col2room=['TIME'];
  let c=ref.s.c+1;
  while(c<=ref.e.c){
    const label=cellVal(headerRow,c);
    if(!label){col2room[c]=col2room[c-1]||'';c++;continue;}
    const m=merges.find(mm=>mm.s.r===headerRow&&mm.s.c===c);
    const span=m?(m.e.c-m.s.c+1):1;
    const room=/^[A-Z]$/.test(label)?label+'강의장':label;
    for(let i=0;i<span;i++)col2room[c+i]=room;
    c+=span;
  }

  const parsed=[];
  for(let r=headerRow+1;r<=ref.e.r;r++){
    const timeStr=cellVal(r,ref.s.c);
    if(!/^\d{1,2}:\d{2}$/.test(timeStr))continue;
    for(let col=ref.s.c+1;col<=ref.e.c;col++){
      const val=cellVal(r,col);
      if(!val)continue;
      const m=merges.find(mm=>mm.s.r===r&&mm.s.c===col);
      const rowSpan=m?(m.e.r-m.s.r+1):1;
      const lines=val.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      const subject=lines[0]||'';
      const room=col2room[col]||'?';
      let teacher='';
      if(lines[1]){
        const parts=lines[1].split('|').map(s=>s.trim());
        if(parts[1])teacher=parts[1].replace(/\d+$/,'')+'강사';
      }
      const getField=label=>{const line=lines.find(l=>l.startsWith(label));return line?line.slice(label.length).trim():'';};
      const fmtDate=d=>{const p=d.split('-');return p.length===3?p[1]+'.'+p[2]:d;};
      const days=getField('요일:');
      const [sh,smn]=timeStr.split(':').map(Number);
      const tot=sh*60+smn+rowSpan*30;
      const timeEnd=String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
      parsed.push({
        id:nextId++,subject,teacher,days,
        isWeekend:/토|일/.test(days),
        startDate:getField('개강일:')?fmtDate(getField('개강일:')):'',
        endDate:getField('종강일:')?fmtDate(getField('종강일:')):'',
        timeStart:timeStr,timeEnd,room,supplies:'X',
        isOnline:room.includes('비대면')?'비대면':'대면'
      });
    }
  }
  if(!parsed.length){setStatus('❌ 지원하지 않는 형식입니다.','err');return;}
  commitParsed(parsed,filename);
}
function commitParsed(parsed,filename){
  const mon=[...new Set(parsed.map(c=>c.startDate.split('.')[0]).filter(Boolean))];
  const ml=mon.length?mon[0]+'월':'?월';
  const wd=parsed.filter(c=>!c.isWeekend),we=parsed.filter(c=>c.isWeekend);
  const wdId='wd_'+ml,weId='we_'+ml;
  tabs=tabs.filter(t=>t.id!==wdId&&t.id!==weId);
  if(wd.length)tabs.push({id:wdId,label:ml+' 평일반',icon:'📅',courses:wd});
  if(we.length)tabs.push({id:weId,label:ml+' 주말반',icon:'🗓️',courses:we});
  activeTab=tabs[0]?.id||activeTab;selected.clear();renderTabs();applyFilters();
  setStatus(`✅ "${filename}" — 평일 ${wd.length}개 / 주말 ${we.length}개 로드 완료`,'ok');
  toast(`✅ ${parsed.length}개 강좌 불러오기 완료!`);
}
function parseSBS(html,filename){
  const rows=[...html.matchAll(/<tr[^>]*>(.*?)<\/tr>/gs)].map(m=>m[1]);
  const col2room=['TIME'];
  const thTags=[...(rows[0]||'').matchAll(/<th([^>]*)>(.*?)<\/th>/gs)];
  thTags.forEach(([,attrs,text])=>{
    const clean=text.replace(/<[^>]+>/g,'').trim();
    const cs=parseInt((attrs.match(/colspan=["']?(\d+)/)||[0,1])[1]);
    if(clean!=='강의실')for(let i=0;i<cs;i++)col2room.push(clean+'강의장');
  });
  const occ={},timeAt={},raw=[];
  rows.forEach((rh,ri)=>{
    if(ri<3)return;const thM=rh.match(/<th[^>]*>(\d+:\d+)<\/th>/);if(!thM)return;
    timeAt[ri]=thM[1];let col=1;
    [...rh.matchAll(/<td([^>]*)>(.*?)<\/td>/gs)].forEach(([,attrs,ch])=>{
      while(occ[ri+','+col])col++;
      const text=ch.replace(/&nbsp;/g,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      const rs=parseInt((attrs.match(/rowspan=["']?(\d+)/)||[0,1])[1]);
      if(text.includes('전체출석율')&&col<col2room.length)raw.push({ri,col,text,rs});
      for(let r=ri+1;r<ri+rs;r++)occ[r+','+col]=true;col++;
    });
  });
  const fmt=d=>{const p=d.split('-');return p[1]+'.'+p[2];};
  const parsed=raw.map(({ri,col,text,rs})=>{
    const subject=text.split('전체출석율')[0].trim();
    const tm=text.match(/배정:\d+(?:\([^)]+\))?\s+([가-힣]+)\d*\s+[월화수목금토일~\/]+\s+개:/);
    const teacher=tm?tm[1]+'강사':'';
    const dm=text.match(/배정:\d+(?:\([^)]+\))?\s+(?:[가-힣]+\d*\s+)?([월화수목금토일~\/]+)\s+개:/);
    const days=dm?dm[1].trim():'';
    const sm=text.match(/개:(\d{4}-\d{2}-\d{2})/);const em=text.match(/종:(\d{4}-\d{2}-\d{2})/);
    const st=timeAt[ri]||'00:00';const[sh,smn]=st.split(':').map(Number);
    const tot=sh*60+smn+rs*30;
    const et=String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
    const isWe=/토|일/.test(days);
    return{id:nextId++,subject,teacher,days,isWeekend:isWe,startDate:sm?fmt(sm[1]):'',endDate:em?fmt(em[1]):'',timeStart:st,timeEnd:et,room:col2room[col]||'?',supplies:'X',isOnline:'대면'};
  });
  if(!parsed.length){setStatus('❌ 지원하지 않는 형식입니다.','err');return;}
  commitParsed(parsed,filename);
}
function setStatus(msg,cls){const el=document.getElementById('upload-status');el.textContent=msg;el.className='upload-status '+cls;}
function initDc(){document.getElementById('dc-list').innerHTML=ROOMS.map(r=>`<div class="dc-row"><label>${r}</label><input type="text" id="dc-${r}" value="${DISCORD[r]}"></div>`).join('');}
function openModal(){document.getElementById('modal-bg').classList.add('open');}
function closeModal(e){if(!e||e.target===document.getElementById('modal-bg'))document.getElementById('modal-bg').classList.remove('open');}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}

init();
</script>
